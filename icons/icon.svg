<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>
  
  <!-- Invoice Document Card with shadow -->
  <g filter="url(#shadow)">
    <rect x="116" y="96" width="280" height="320" rx="28" fill="url(#cardGrad)"/>
    
    <!-- Top Header Bar on document -->
    <rect x="116" y="96" width="280" height="70" rx="28" fill="#1e293b"/>
    <rect x="116" y="136" width="280" height="30" fill="#1e293b"/> <!-- square bottom of header -->
    
    <!-- Header Logo Dot & Lines -->
    <circle cx="156" cy="131" r="14" fill="#10b981"/>
    <rect x="186" y="123" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="186" y="137" width="50" height="6" rx="3" fill="#94a3b8"/>
    
    <!-- Invoice Content Rows -->
    <rect x="148" y="190" width="216" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="148" y="218" width="160" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="148" y="242" width="190" height="10" rx="5" fill="#cbd5e1"/>
    
    <!-- Divider Line -->
    <line x1="148" y1="274" x2="364" y2="274" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Total Amount Badge -->
    <rect x="148" y="296" width="216" height="48" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748b">TOTAL</text>
    <text x="348" y="328" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0f172a">₹ 18,499</text>
    
    <!-- Security Shield / Verified Star Badge -->
    <circle cx="346" cy="374" r="32" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <path d="M336 374 L343 381 L358 366" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>